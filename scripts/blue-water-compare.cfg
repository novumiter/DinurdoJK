// Run from the camera you want to compare; keep still for about 50 seconds.
// Preserves Godot FFT size and mesh quality. Leaves BlueWater selected.
exec blue_water_optimized.cfg
set r_gpuTimings 1
set r_oceanBackend 0
perfsample 10 godot_current_view_warmup
render_perf_capture 180 godot_current_view
perfsample 15 godot_current_view
set r_oceanBackend 1
perfsample 10 bluewater_current_view_warmup
render_perf_capture 180 bluewater_current_view
perfsample 15 bluewater_current_view
