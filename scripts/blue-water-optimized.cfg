// Optimized BlueWater hybrid. Godot FFT size and mesh quality are preserved.
// For ocean-only A/B, keep the same sky/cloud settings on both backends.
set r_skyBackend 0
set r_cloudBackend 0
set r_clouds 0
set r_ocean 1
set r_oceanBackend 1
set r_oceanUpdates 60
set r_blueWaterMeshSegments 64
set r_blueWaterMeshLevels 6
set r_blueWaterBoundaryMode 3
set r_blueWaterCausticsMode 3
set r_blueWaterUnderwaterMode 4
set r_blueWaterPrepareGodotMesh 0
set r_blueWaterAdapter 1
set r_blueWaterSSR 0
set r_blueWaterRefractionMode 1
set r_blueWaterRefraction 0.1
set r_blueWaterHeight 1.8
set r_blueWaterDirection 35
set r_blueWaterWavelength 70.440796
set r_blueWaterChoppiness 2.2543192
set r_blueWaterWindSpeed 9
set r_blueWaterTransparency 1
set r_blueWaterWaterColor "0.28627452 0.34117648 0.36862746"
set r_blueWaterFogColor "0.1764706 0.21568628 0.23529412"
set r_oceanCaustics 1
