// Apply Minimal Unified, Low or Medium first, then exec shader_modes_ab.
// Keep the same view. This changes only the shader mode; sorting and quality stay as selected.
// Active-mode and actual bind counters are printed by every labelled sample.
set r_fragmentShaderMode 1
perfsample 10 mode1_warmup
perfsample 5 mode1_before
set r_fragmentShaderMode 3
perfsample 10 mode3_warmup
perfsample 5 mode3_shared
set r_fragmentShaderMode 4
perfsample 15 mode4_warmup
perfsample 5 mode4_generated
set r_fragmentShaderMode 2
perfsample 10 mode2_warmup
perfsample 5 mode2_minimal
set r_fragmentShaderMode 1
perfsample 5 mode1_after
echo SHADER MODES A/B DONE - final shader mode is 1
